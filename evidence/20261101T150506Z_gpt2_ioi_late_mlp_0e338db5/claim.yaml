claim_id: gpt2_ioi_late_mlp_decision_v1
hypothesis: 'In GPT-2 small on IOI with an S2-flip corruption, the late MLP blocks
  9, 10 and 11 jointly carry the indirect-object decision: restoring their clean outputs
  restores at least half of the logit contrast.'
mechanism: Late MLPs write the answer-name direction into the residual stream at the
  final position.
model: openai-community/gpt2
model_revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
unit: MLP block outputs 9, 10, 11 (all positions, patched jointly)
metric: answer_minus_distractor_logit_margin
intervention: patch_clean_activation_into_corrupt_run
scope:
  task: ioi_s2_flip
  input_distribution: 16 registered IOI templates (8 discovery, 8 holdout), 40 single-token
    first names split 30/10, 12 places, 10 objects, both name orders
  backends:
  - eager
  - sdpa
  dtype: float32
